<title>천하의 주인 G1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&family=Song+Myung&display=swap" rel="stylesheet">
<style>
/* 배치: 채색 양피지 지도가 화면 전체. 그 위에 금테 두른 어두운 목재·가죽 판(왼쪽 창, 오른쪽 장부, 아래 명령대)이 떠 있다.
   중세 대전략 게임의 창 구성을 따르되, 문양·서체·색은 후삼국(한지·인장·단청)에서 가져온다. 단일 어두운 테마. */
:root{
  color-scheme:dark;
  --ground:#17130f; --panel:#221c16; --panel-2:#2d251d; --panel-3:#3a2f24; --line:#5d4a2c; --gold:#c9a455; --gold-hi:#ecd08a; --gold-lo:#7a6236;
  --text:#ece2ca; --muted:#a8997c; --dim:#75694f; --seal:#a12a1e; --seal-2:#d2543f; --good:#93bd76; --mid:#d9b25a; --jade:#5f9c8c;
  --parch:#dccba4; --parch-2:#c9b68a; --sea:#2f4a57; --sea-2:#3b5c6a; --ink:#231a10; --ink-2:#4a3a25;
  --font-display:'Nanum Myeongjo','Song Myung','Noto Serif KR','Noto Serif CJK KR',serif;
  --font-seal:'Song Myung','Nanum Myeongjo','Noto Serif CJK KR',serif;
  --font-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR',sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --rail:50px; --rw:372px; --lw:384px; --barh:92px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--text);font:13.5px/1.5 var(--font-body);overflow:hidden;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:var(--gold-hi)}
#app{position:relative;height:100%;min-height:520px;overflow:hidden;background:var(--sea)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
#map.drag{cursor:grabbing}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(10,8,6,.55) 100%)}

/* ── 지도 ── */
.sea{fill:var(--sea)} .land{fill:var(--parch);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.land-sh{fill:#16242b;opacity:.55} .isle{fill:var(--parch-2);stroke:var(--ink);stroke-width:1.3}
.cell{stroke:var(--ink);stroke-opacity:.42;stroke-width:1.1;stroke-linejoin:round;fill-opacity:.5;pointer-events:none}
.cell.hatch{fill-opacity:.85;stroke:none}
.cell.sel{stroke:var(--gold-hi);stroke-opacity:1;stroke-width:3;fill-opacity:0}
.landline{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round;pointer-events:none}
.river{fill:none;stroke:#54798a;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.ridge{fill:none;stroke:var(--ink-2);stroke-width:2.6;stroke-linejoin:miter;opacity:.6} .ridge.minor{stroke-width:1.5;opacity:.38}
.geo{font-family:var(--font-seal);fill:#d7e3e6;opacity:.3;letter-spacing:.5em;pointer-events:none} .geo.mt{fill:var(--ink);opacity:.3}
.realm{font-family:var(--font-seal);fill:var(--ink);opacity:.5;letter-spacing:.42em;pointer-events:none;paint-order:stroke;stroke:var(--parch);stroke-width:3px;stroke-opacity:.35}
.road{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.42} .road.pass{stroke-dasharray:2 5;stroke-linecap:round;stroke-width:2.2}
.road.sea-route{stroke:#c7d6da;stroke-dasharray:9 6;opacity:.55}
.hl{fill:none;stroke:var(--seal-2);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;opacity:.95;stroke-dasharray:1 9}
.hl.solid{stroke-dasharray:none;opacity:.6}
.rg{cursor:pointer} .rg .hit{fill:transparent}
.rg .shield{stroke:var(--gold-hi);stroke-width:1.6;stroke-linejoin:round;filter:drop-shadow(0 1.5px 1.5px rgba(0,0,0,.6))}
.rg .chief{stroke:none}
.rg .hj{font-family:var(--font-seal);font-size:13px;fill:#f6eed8;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.rg .crown{fill:var(--gold-hi);stroke:var(--ink);stroke-width:.8}
.rg .nm{font-family:var(--font-display);font-weight:800;font-size:16px;fill:#fbf4e0;paint-order:stroke;stroke:#1a130b;stroke-width:4;stroke-linejoin:round}
.rg .gr{font-size:12.5px;fill:#e9dcbc;paint-order:stroke;stroke:#1a130b;stroke-width:3.5;font-weight:600}
.rg .gr.est{font-style:italic;fill:#d8c79f} .rg .gr.unk{fill:#ffb3a3}
.rg .pip{fill:#1a130b;stroke:var(--gold-hi);stroke-width:.5} .rg .pip.off{fill:none;stroke:#1a130b;stroke-width:.7;opacity:.6}
.rg .selr{fill:none;stroke:var(--gold-hi);stroke-width:2.4;stroke-dasharray:3 3}
.rg .siege{fill:none;stroke:var(--seal-2);stroke-width:3;stroke-dasharray:5 4;animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.rg .wk{fill:var(--gold-hi);stroke:#1a130b;stroke-width:.8}
@keyframes spin{to{transform:rotate(360deg)}}
.army{cursor:pointer} .army .pole{stroke:#1a130b;stroke-width:2}
.army .flag{stroke:#1a130b;stroke-width:1}
.army .plate{fill:#1d1711;stroke:var(--gold);stroke-width:1}
.army .an{font-size:12px;font-weight:600;fill:var(--text)}
.army.est .flag{stroke-dasharray:3 2;fill-opacity:.6} .army.est .plate{stroke-dasharray:3 2} .army.ghost{opacity:.5;cursor:default}
.army.sel .plate{stroke:var(--gold-hi);stroke-width:2}
.rg .mob{font-family:var(--font-seal);font-size:11px;fill:#1a130b;paint-order:stroke;stroke:var(--gold-hi);stroke-width:3px;pointer-events:none}
@media (prefers-reduced-motion:reduce){.rg .siege{animation:none}}

/* ── 판(창) ── */
.slab{position:relative;background:linear-gradient(180deg,var(--panel-2) 0,var(--panel) 46px,var(--panel) 100%);border:1px solid var(--gold-lo);box-shadow:inset 0 0 0 1px rgba(0,0,0,.65),inset 0 1px 0 1px rgba(236,208,138,.1),0 8px 22px rgba(0,0,0,.55)}
.slab.orn::before,.slab.orn::after{content:"";position:absolute;top:-4px;width:7px;height:7px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 0 1px #1a130b}
.slab.orn::before{left:-4px}.slab.orn::after{right:-4px}
.win-h{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--gold-lo);background:linear-gradient(180deg,#43301f,#2a1f16);box-shadow:inset 0 -1px 0 rgba(0,0,0,.6)}
.win-h h2{flex:1;min-width:0}
.x{width:26px;height:26px;border:1px solid var(--gold-lo);background:linear-gradient(180deg,#6d2218,#47150f);color:var(--gold-hi);cursor:pointer;line-height:1;font-size:15px;flex:none}
.x:hover{border-color:var(--gold-hi)}
h2{font:800 20px/1.2 var(--font-display);margin:0;color:var(--gold-hi);text-wrap:balance;letter-spacing:.01em}
h3{font:700 12.5px/1 var(--font-display);color:var(--gold);letter-spacing:.18em;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-lo),transparent)}
.sub{color:var(--muted);font-size:12px} .chip{display:inline-block;padding:1px 7px;background:var(--c,#555);color:#fff;font-size:12px;font-weight:500;border:1px solid rgba(0,0,0,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0} .kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.pips{letter-spacing:2px;color:var(--gold)} .note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.tag{font-size:11px;border:1px solid var(--line);padding:0 5px;color:var(--muted);white-space:nowrap} .tag.c{color:var(--text);border-color:var(--muted)} .tag.e{font-style:italic} .tag.u{color:var(--seal-2);border-color:var(--seal-2)}
.tag.g{color:var(--good);border-color:var(--good)} .tag.m{color:var(--mid);border-color:var(--mid)} .tag.gold{color:var(--gold-hi);border-color:var(--gold)}
.good{color:var(--good)} .mid{color:var(--mid)} .badc{color:var(--seal-2)}
.warn{color:var(--seal-2);font-size:12.5px;margin-top:6px}
.btn{border:1px solid var(--gold-lo);background:linear-gradient(180deg,#43382b,#2b241b);padding:5px 12px;cursor:pointer;white-space:nowrap;color:var(--text);box-shadow:inset 0 1px 0 rgba(236,208,138,.14),inset 0 0 0 1px rgba(0,0,0,.45)}
.btn:hover{border-color:var(--gold-hi);background:linear-gradient(180deg,#4f4333,#332a20)}
.btn.pri{background:linear-gradient(180deg,#96301f,#651c12);border-color:#c98a4a;color:#fff3dc;font-weight:600} .btn.pri:hover{background:linear-gradient(180deg,#ad3a26,#752218)}
.btn.gold{background:linear-gradient(180deg,#8a6b2c,#5b4519);border-color:var(--gold-hi);color:#fff3dc;font-weight:600}
.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed} .btn.sm{padding:2px 8px;font-size:12px} .btn.on{background:linear-gradient(180deg,#e3cf9b,#bfa565);color:var(--ink);font-weight:600;border-color:var(--gold-hi)}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:1px}
.seg{display:flex} .seg button{border:1px solid var(--gold-lo);background:linear-gradient(180deg,#3d3327,#2a231b);padding:4px 9px;cursor:pointer;margin-left:-1px;min-width:34px}
.seg button.on{background:linear-gradient(180deg,#e3cf9b,#bfa565);color:var(--ink);font-weight:700}
.seg.stance,.seg.wrap{flex-wrap:wrap} .seg.stance button,.seg.wrap button{flex:1}
select,input[type=number],input[type=search],input[type=text]{background:#17120d;border:1px solid var(--line);padding:4px 8px;width:100%;color:var(--text)}
input[type=range]{width:100%;accent-color:var(--gold)} input[type=checkbox]{accent-color:var(--gold)}
.fld{display:block;margin:8px 0 3px;color:var(--muted);font-size:12px}
table.u{width:100%;border-collapse:collapse;font-size:13px} table.u td,table.u th{padding:3px 0;text-align:right;font-weight:400} table.u th{color:var(--muted);font-size:11px} table.u td:first-child,table.u th:first-child{text-align:left}
.urow{display:grid;grid-template-columns:92px 1fr 78px;gap:8px;align-items:center;margin:4px 0;line-height:1.25} .urow small{color:var(--muted);display:block;font-size:11px;white-space:nowrap}
.pv{background:#1a1510;border:1px solid var(--line);padding:8px 12px;margin-top:10px} .pv .odds{font:800 19px/1.2 var(--font-display)}
.wbar{display:flex;height:8px;margin:6px 0 4px;background:var(--line)} .wbar i{display:block;height:100%} .wbar .w1{background:var(--good)} .wbar .w2{background:var(--seal-2)} .wbar .w3{background:var(--muted)}
table.cmp td,table.cmp th{padding:3px 4px} table.cmp td:nth-child(n+2),table.cmp th:nth-child(n+2){text-align:right} table.cmp tr.hot td{background:rgba(201,164,85,.14)}
.rnd{display:grid;grid-template-columns:62px 1fr 92px;gap:8px;align-items:center;margin:2px 0} .rnd .sub:last-child{text-align:right}
.pbar{display:block;height:8px;background:#3d5a78} .pbar i{display:block;height:100%;background:var(--seal-2)}
.lb{display:inline-block;width:54px;height:6px;background:#17120d;border:1px solid var(--line);vertical-align:middle;margin:0 4px} .lb i{display:block;height:100%;background:var(--good)} .lb.lo i{background:var(--seal-2)} .lb.mid i{background:var(--mid)}
.parts{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;margin-top:6px}
.kinds{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 2px}
.seal{width:54px;height:54px;display:grid;place-items:center;font:32px/1 var(--font-seal);color:#f6eed8;border:2px solid var(--gold-hi);outline:1px solid rgba(0,0,0,.7);flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35);border-radius:3px 3px 50% 50%/3px 3px 38% 38%}
.seal.sm{width:32px;height:36px;font-size:18px;border-width:1.5px}

/* 왼쪽 아래: 군주 초상 원형틀 */
#plaque{position:absolute;left:var(--gl);bottom:16px;display:flex;gap:10px;align-items:center;padding:8px 14px 8px 8px;z-index:6;height:var(--barh);max-width:300px}
#plaque .port{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font:38px/1 var(--font-seal);color:#f6eed8;border:3px solid var(--gold);box-shadow:0 0 0 1px #1a130b,inset 0 0 0 2px rgba(0,0,0,.45),inset 0 -14px 22px rgba(0,0,0,.35);flex:none}
#plaque .who{font:800 19px/1.15 var(--font-display);color:var(--gold-hi)} #plaque .ttl{color:var(--muted);font-size:11.5px;line-height:1.35}
/* 오른쪽 아래: 날짜·속도 */
#clock{position:absolute;right:var(--gr);bottom:16px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;justify-content:center;z-index:6;white-space:nowrap;height:var(--barh);width:calc(var(--rw) + var(--rail) + 6px)}
#clock .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
#clock .date{font:800 19px/1 var(--font-display);color:var(--gold-hi)} #clock .wk{color:var(--muted);font-size:11.5px}
#clock .bar{flex:1;height:5px;background:#17120d;border:1px solid var(--line)} #clock .bar i{display:block;height:100%;background:var(--gold);width:0}
#clock .phase{font-size:11.5px;color:var(--seal-2);font-weight:600}
/* 위 오른쪽: 자원 띠 */
#res{position:absolute;right:var(--gr);top:12px;display:flex;z-index:6;max-width:calc(100% - var(--gl) - var(--gr))}
#res .cell{padding:6px 12px 6px 10px;border-left:1px solid var(--line);display:grid;grid-template-columns:auto auto;gap:0 8px;align-items:center} #res .cell:first-child{border-left:0}
#res .ic{grid-row:1/3;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:15px/1 var(--font-seal);color:var(--ink);background:radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold-lo));border:1px solid #1a130b}
#res .v{font-size:16px;font-weight:700;line-height:1.15} #res .v small{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px} #res .d{font-size:11px;color:var(--muted);line-height:1.2} #res .bad{color:var(--seal-2)}
#res .cell[data-act]{cursor:pointer} #res .cell[data-act]:hover{background:rgba(236,208,138,.07)}
/* 왼쪽 창 */
#left{position:absolute;left:var(--gl);top:12px;bottom:calc(var(--barh) + 28px);width:var(--lw);display:flex;flex-direction:column;z-index:4;pointer-events:none}
#left .slab{pointer-events:auto;display:flex;flex-direction:column;max-height:100%;min-height:0}
#left .body{overflow:auto;padding:12px 14px 14px;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--gold-lo);background:#1a1510} .tabs button{flex:1;background:none;border:0;padding:8px 2px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-family:var(--font-display);font-weight:700}
.tabs button.on{color:var(--gold-hi);border-bottom-color:var(--gold);background:linear-gradient(180deg,transparent,rgba(201,164,85,.1))}
/* 오른쪽: 세로 메뉴 띠 + 장부 */
#rail{position:absolute;right:var(--gr);top:74px;bottom:calc(var(--barh) + 28px);width:var(--rail);z-index:5;display:flex;flex-direction:column;gap:4px}
#rail button{width:var(--rail);height:52px;border:1px solid var(--gold-lo);background:linear-gradient(180deg,#3d3327,#231c15);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:inset 0 1px 0 rgba(236,208,138,.14),0 3px 8px rgba(0,0,0,.45);position:relative}
#rail button b{font:400 20px/1 var(--font-seal);color:var(--gold-hi)} #rail button span{font-size:10.5px;color:var(--muted)}
#rail button.on{background:linear-gradient(180deg,#8a6b2c,#4d3a16);border-color:var(--gold-hi)} #rail button.on span{color:#fff3dc}
#rail button i{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--seal);color:#fff;font:600 10.5px/17px var(--font-body);font-style:normal;text-align:center;border:1px solid #1a130b;padding:0 3px}
#right{position:absolute;right:calc(var(--gr) + var(--rail) + 6px);top:74px;bottom:calc(var(--barh) + 28px);width:var(--rw);display:flex;flex-direction:column;z-index:4}
#right.shut{display:none}
#feed{overflow:auto;flex:1;padding:0 0 4px;min-height:0} #sheet{overflow:auto;flex:1;padding:14px;min-height:0}
.it{padding:7px 14px;border-bottom:1px solid rgba(93,74,44,.5);font-size:13px} .it[data-region]{cursor:pointer} .it:hover[data-region]{background:rgba(236,208,138,.06)}
.it .w{color:var(--muted);font-size:11px;display:block} .it.urgent{border-left:3px solid var(--seal-2);padding-left:11px}
.it.dev{font-size:12px;color:var(--muted)} .it.dev b{color:var(--text);font-weight:500}
.prop{margin:10px;padding:12px;border:1px solid var(--seal-2);background:#2a1a14} .prop .row{display:flex;gap:8px;margin-top:8px}
.ob{padding:6px 14px;border-bottom:1px solid rgba(93,74,44,.5);font-size:13px} .ob.due{border-left:3px solid var(--seal-2);padding-left:11px} .ob .w{color:var(--muted);font-size:11px;display:block}
.sec{font:700 12.5px/1 var(--font-display);color:var(--gold);letter-spacing:.18em;padding:11px 14px 7px;background:linear-gradient(180deg,#30261b,#231c15);border-bottom:1px solid var(--line);border-top:1px solid rgba(0,0,0,.5)}
/* 아래 명령대 */
#bar{position:absolute;left:calc(var(--gl) + 310px);right:calc(var(--gr) + var(--rw) + var(--rail) + 18px);bottom:16px;display:flex;gap:0;z-index:5;height:var(--barh);overflow:auto hidden}
#bar .grp{padding:8px 12px 8px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px;justify-content:center;flex:none} #bar .grp:first-child{border-left:0}
#bar .gl{font:700 12px/1 var(--font-display);color:var(--gold);letter-spacing:.2em} #bar .btns{display:flex;gap:5px;flex-wrap:nowrap}
#bar .ctx{min-width:120px} #bar .ctx b{font:800 17px/1.2 var(--font-display);color:var(--gold-hi)}
#bar .sys{margin-left:auto}
#toast[hidden]{display:none}
#toast{position:absolute;left:50%;bottom:calc(var(--barh) + 30px);transform:translateX(-50%);padding:9px 16px;z-index:60;max-width:min(560px,90%);text-align:center;border-color:var(--gold)}
#banner .btn{flex:none}
#banner{position:absolute;left:50%;top:74px;transform:translateX(-50%);z-index:7;padding:7px 10px 7px 14px;display:flex;gap:10px;align-items:center;border-color:var(--gold);white-space:nowrap}
#banner b{font:800 15px/1 var(--font-display);color:var(--gold-hi)}
#zoom{position:absolute;right:calc(var(--gr) + var(--rw) + var(--rail) + 18px);bottom:calc(var(--barh) + 28px);z-index:3;display:flex;flex-direction:column}
#zoom button{width:30px;height:30px;margin-top:-1px;padding:0}
#app.idle>.slab,#app.idle #left,#app.idle #zoom,#app.idle #rail,#app.idle #right,#app.idle #banner{display:none}
#app.noright #bar{right:calc(var(--gr) + var(--rw) + var(--rail) + 18px)} #app.noright #zoom{right:calc(var(--gr) + var(--rail) + 12px)}

/* ── 도시 내정(S02) ── */
.meter{display:grid;grid-template-columns:54px 1fr 46px;gap:8px;align-items:center;margin:3px 0;font-size:12.5px} .meter .lbl{color:var(--muted)} .meter .val{text-align:right}
.track{height:8px;background:#17120d;border:1px solid var(--line);position:relative} .track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-lo),var(--gold))} .track.bad i{background:linear-gradient(90deg,#6d2218,var(--seal-2))} .track.ok i{background:linear-gradient(90deg,#4f6d3d,var(--good))}
.slot{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);background:#1a1510;margin:4px 0}
.slot .role{color:var(--gold);font-family:var(--font-display);font-weight:700;font-size:12.5px} .slot .who b{font-weight:600} .slot .who .sub{display:block;line-height:1.3}
.slot.empty .who{color:var(--dim)} .slot .acts{display:flex;gap:4px}

  // 조사 고르기: '이(가)·을(를)·은(는)·와(과)·(으)로'를 앞 글자의 받침에 맞춘다. 표시용 문자열만 바꾸고 판정에는 쓰이지 않는다.

function fit(){const r=svg.getBoundingClientRect(),asp=Math.max(.3,r.width/Math.max(1,r.height));let h=1110,w=h*asp;if(w<900){w=900;h=w/asp}G.vb={x:389-w/2,y:470-h/2,w,h};applyVB()}
function applyVB(){const v=G.vb;svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`)}
function zoomAt(f,cx,cy){const v=G.vb,nw=Math.min(3200,Math.max(260,v.w/f)),k=nw/v.w;if(cx===undefined){cx=v.x+v.w/2;cy=v.y+v.h/2}v.x=cx-(cx-v.x)*k;v.y=cy-(cy-v.y)*k;v.w=nw;v.h*=k;applyVB()}
const toWorld=(ex,ey)=>{const r=svg.getBoundingClientRect(),v=G.vb;return[v.x+(ex-r.left)/r.width*v.w,v.y+(ey-r.top)/r.height*v.h]};

const share=(f,c)=>Sim.shares(G.s,f,c);
const rel=f=>{const s=G.s,m=me();if(f===m)return'우리';if(s.factions[f].overlord===m)return'우리를 섬김';if(s.factions[m].overlord===f)return'우리의 종주';if(Sim.atWar(s,m,f))return'교전 중';if(Sim.sameBloc(s,m,f))return'같은 편';const t=Sim.trust(s,m,f);return t>=60?'우호':t<30?'적대적':'중립'};
function garrText(rid){const s=G.s,R=s.regions[rid];if(share(me(),R.controller))return{t:fmt(Sim.total(R.garrison)),c:'',tag:'<span class="tag c">확인</span>',long:fmt(Sim.total(R.garrison))+'명'};
  const it=Sim.regionIntel(s,me(),rid);if(it.conf==='unknown')return{t:'?',c:'unk',tag:'<span class="tag u">미확인</span>',long:'정보 없음. 정찰이 필요합니다.'};
  const ago=it.age?` (${it.age}주 전)`:'';if(!it.garr)return{t:'빈 성',c:'est',tag:'<span class="tag e">추정</span>',long:'지키는 병력이 거의 없어 보입니다'+ago};if(it.conf==='confirmed')return{t:fmt(it.garr),c:'',tag:'<span class="tag c">확인</span>',long:fmt(it.garr)+'명'+ago};
  return{t:'약 '+fmt(it.garr),c:'est',tag:'<span class="tag e">추정</span>',long:'약 '+fmt(it.garr*.75)+'~'+fmt(it.garr*1.25)+'명'+ago}}
const armyTxt=v=>v.conf==='confirmed'?fmt(v.est):'약 '+fmt(v.est);
function armyPos(a){const s=G.s;let L=a.leg,acc=G.paused&&!G.acc?0:G.acc;
  if(!L&&a.path.length){const e=Sim.edgeBetween(a.loc,a.path[0]);if(e)return epoint(a.loc,a.path[0],Math.min(1,acc/Sim.edgeWeeks(e,a.units,s.week)))}
  if(!L)return RP[a.loc];return epoint(L.a,L.b,L.f0+(L.f1-L.f0)*Math.min(1,(L.done+acc)/L.cost))}
function etaOf(a){const s=G.s;let w=a.leg?a.leg.cost-a.leg.done:0,cur=a.leg?a.leg.to:a.loc;for(const n of a.path){if(n===cur)continue;const e=Sim.edgeBetween(cur,n);if(e)w+=Sim.edgeWeeks(e,a.units,s.week);cur=n}return w}

function drawHL(){
  const s=G.s;let h='';const line=(from,path,cls)=>{let cur=from,d='';for(const n of path){d+=epath(cur,n);cur=n}return d?`<path class="hl ${cls||''}" d="${d}"/>`:''};
  if(G.sheet&&G.sheet.pv&&G.sheet.pv.ok&&G.sheet.pv.path)h+=line(G.sheet.from,G.sheet.pv.path);
  else if(G.sel&&G.sel.type==='army'){const a=s.armies[G.sel.id];if(a&&a.factionId===me()){const p=a.leg?[a.leg.to].concat(a.path.filter(n=>n!==a.leg.to)):a.path;h+=line(a.loc,p,'solid')}}
  $('#hl').innerHTML=h;
}

function pvMarch(){const sh=G.sheet,s=G.s;sh.pv=Sim.previewMarch(s,me(),{fromRegionId:sh.from,targetRegionId:sh.target,units:sh.units,commanderId:sh.commanderId||null,deputyIds:sh.deps.filter(Boolean),stance:sh.stance,breakTruce:!!sh.breakTruce});
  const p=sh.pv,el=$('#pv');if(!el)return;
  if(!p.ok){el.innerHTML=`<div class="warn">${esc(p.reason)}</div>${p.code==='truce'?`<button class="btn sm" style="margin-top:6px" data-act="break-truce">휴전을 깨고 출정한다</button><div class="sub">군이 그 땅에 닿는 순간 휴전이 깨집니다. 정통성 −8, 상대 신뢰 −30, 다른 모든 세력의 신뢰 −10, 평판 하락.</div>`:''}`;J(el);$('#go').setAttribute('aria-disabled','true');$('#go').dataset.why=p.reason;UN.forEach(k=>{const e=$('#ef-'+k);if(e){e.textContent='—';e.className=''}});drawHL();return}
  $('#go').removeAttribute('aria-disabled');
  const T=s.regions[sh.target];let odds='';
  UN.forEach(k=>{const e=$('#ef-'+k);if(e){const v=p.eff[k];e.textContent=T.terrain+(p.mission==='attack'&&T.fort?'·성'+T.fort:'')+' ×'+v.toFixed(2);e.className=v>1.001?'good':v<0.999?'badc':''}});
  if(p.odds&&p.odds.conf==='unknown')odds=`<div class="odds">예상 불가</div><div class="sub">적 병력을 모릅니다. 정찰을 먼저 보내면 예상이 나옵니다.</div>`;
  else if(p.odds){const o=p.odds;odds=`<div class="odds ${o.label==='유리'?'good':o.label==='접전'?'mid':'badc'}">함락 확률 ${o.win}%</div>
    <div class="wbar" aria-hidden="true"><i class="w1" style="width:${o.win}%"></i><i class="w2" style="width:${o.fail+o.rout}%"></i><i class="w3" style="width:${o.stall}%"></i></div>
    <div class="sub">함락 ${o.win}% · 격퇴당함 ${o.fail+o.rout}% · ${o.simWeeks}주 안에 결판 안 남 ${o.stall}%${o.weeks?' · 함락까지 평균 '+o.weeks+'주':''} · 예상 손실 ${fmt(o.loss)}명</div>
    <div class="sub" style="margin-top:4px">적 ${o.conf==='confirmed'?'':'약 '}${fmt(o.est)}명 기준${o.knownMix?' · 정찰로 본 편성':' · 편성은 짐작'}${o.defCmd?' · 수비 장수 '+esc([o.defCmd].concat(o.defStaff).join('·')):''}. 실제 전투와 같은 식으로 240번 굴린 결과입니다.</div>
    <div class="sub ${o.ambush>=25?'badc':''}">매복 위험 ${o.ambush}%${o.scouted?' (정찰로 낮춤)':' · 정찰하면 낮아집니다'}</div>`}
  else odds=`<div class="odds">${p.mission==='station'?'주둔 이동':'우군 지원'}</div><div class="sub">${p.mission==='station'?'도착하면 그곳 주둔군에 합류합니다.':'도착해서 함께 성을 지킵니다. 수비할 때는 방어 방침이 유리합니다.'}</div>`;
  el.innerHTML=`${odds}<dl class="kv" style="margin-top:8px"><dt>총 병력 · 기초 전력</dt><dd>${fmt(p.total)}명 · ${fmt(p.basePower)}</dd><dt>지휘 보정</dt><dd>${pctS(p.staff.cmdF)}${p.staff.mix>0.001?' · 다병종 −'+Math.round(p.staff.mix*100)+'%':''}</dd><dt>도착</dt><dd>${p.eta}주 뒤 (${Sim.dateStr(s.week+p.eta)})</dd><dt>군량 · 국고 유지</dt><dd>주당 ${fmt(p.perWeek)} · ${p.gold}</dd><dt>가져가는 군량</dt><dd>${fmt(p.carry)} · ${p.carryWeeks}주치</dd>
    <dt>목표지 보급선</dt><dd class="${p.supply.linked?'':'badc'}">${p.supply.linked?'이어짐 ('+esc(p.supply.via)+')':'끊김: 가져간 군량뿐'}</dd><dt>남는 주둔군</dt><dd>${fmt(p.remain)}명</dd></dl>
   ${p.short?'<div class="warn">군량이 모자랍니다. 굶기 시작하면 사기와 병력이 줄고 전투력이 20% 떨어집니다.</div>':''}${p.declaresWar?`<div class="warn">${esc(fnm(T.controller))}와(과) 전쟁이 시작됩니다. 다른 호족들의 신뢰도 떨어집니다.</div>`:''}${sh.breakTruce&&Sim.truceBetween(s,me(),T.controller)?'<div class="warn">휴전을 깨는 출정입니다. 군이 그 땅에 닿는 순간 휴전이 깨집니다.</div>':''}${Sim.sameBloc(s,me(),T.controller)?callBlock(sh.target):mobHint()}`;
  J(el);drawHL();
}

function clipHalf(poly,a,b){const nx=b[0]-a[0],ny=b[1]-a[1],c=(b[0]*b[0]+b[1]*b[1]-a[0]*a[0]-a[1]*a[1])/2,out=[];

const GOLDCAT={tax:'세수',tribute:'상납',upkeep:'병사 급료',salary:'관직 봉록',admin:'행정 유지비',facility_upkeep:'시설 유지비',national:'국정 예산',facility:'시설 착공',recruit:'모병',fortify:'성 보강',buy_grain:'곡식 매입',intel:'정찰·첩보',diplomacy:'외교',pacify:'민심 수습',reward:'포상',arrears:'못 준 급료(탕감)',etc:'기타'};
const GRAINCAT={harvest:'수확',buy:'매입',requisition:'징발',garrison:'주둔군 소모',army:'출정군 소모',transport:'수송 손실',capture:'점령·상실',etc:'기타(흩어진 부대 등)'};
function ledTable(obj,names){const ks=Object.keys(names).filter(k=>obj[k]&&Math.abs(obj[k])>=0.05);let t=0;for(const k in obj)t+=obj[k];
  return `<table class="led">${ks.map(k=>`<tr><td>${names[k]}</td><td class="${obj[k]<0?'badc':'good'}">${sgn(obj[k],1)}</td></tr>`).join('')||'<tr><td>거래 없음</td><td></td></tr>'}<tr class="tot"><td>순증감</td><td class="${t<0?'badc':'good'}">${sgn(t,1)}</td></tr></table>`}
function priorities(x,ro){
  const s=G.s,m=me(),F=s.factions[m],out=[],add=(p,text,act)=>out.push({p,text,act:act||''}),go=(label,attrs)=>`<button class="btn sm" ${attrs}>${label}</button>`,toR=id=>go('거점 보기',`data-act="rv-goto" data-id="${id}"`);
  const sm=Sim.factionSummary(s,m),net=sm.income-sm.gold,gw=sm.use>0?sm.grain/sm.use:99;
  if(!ro){if(net<0&&F.treasury<-net*8)add(0,'국고가 '+Math.max(0,Math.floor(F.treasury/-net))+'주 안에 바닥납니다. 주간 수지 '+sgn(net)+'.',go('국정 예산',`data-act="rv-tab" data-v="nation"`));
    if(gw<8)add(0,'군량이 '+Math.floor(gw)+'주치뿐입니다.',toR(F.capitalId));
    for(const r of D.RIDS){const R=s.regions[r];if(R.siege&&Sim.sameBloc(s,m,R.controller))add(0,R.name+'이(가) 포위돼 있습니다 ('+fnm(R.siege.by)+'군, '+(s.week-R.siege.start+1)+'주째).',toR(r))}
    for(const e of Sim.obligations(s,m).mine)if(e.ob.due!==null&&e.ob.due-s.week<=3)add(0,'지킬 약속의 기한이 '+Math.max(0,e.ob.due-s.week)+'주 남았습니다: '+e.text,go('조정',`data-act="rv-tab" data-v="court"`))}
  for(const a of x.politicalAlerts)add(a.type==='CRISIS_CANDIDATE'?0:1,a.text,a.regionId?toR(a.regionId):'');
  for(const p of x.projectDeltas){if(p.completed)add(1,p.name+' 완료.'+(p.awaitingEnact?' 시행해야 효과가 납니다.':''),p.awaitingEnact&&!ro&&s.dom.nationalProjectsByFaction[m].enacted[p.projectId]===undefined?go('시행한다',`data-act="enact" data-v="${p.projectId}"`):go('국정',`data-act="rv-tab" data-v="nation"`));
    else if(p.vacantWeeks)add(1,Dm.CATNAME[p.category]+' 담당관이 '+p.vacantWeeks+'주 자리를 비워 '+p.name+' 진척이 줄었습니다.',ro?'':go('담당관 임명',`data-act="opk" data-slot="national:${m}:${p.category}"`));
    else if(p.unpaidWeeks)add(1,'국고가 모자라 '+p.name+' 예산을 '+p.unpaidWeeks+'주 못 냈습니다.',go('국정 예산',`data-act="rv-tab" data-v="nation"`))}
  if(!ro){for(const n of Dm.nationalView(s,m)){if(!n.slot.projectId&&n.list.some(p=>!p.done&&!p.locked.length))add(1,n.name+': 진행 중인 과제가 없습니다.'+(n.officer?'':' 담당관도 공석입니다.'),n.officer?go('과제 고르기',`data-act="rv-tab" data-v="nation"`):go('담당관 임명',`data-act="opk" data-slot="national:${m}:${n.cat}"`))}
    const vac=x.cityDeltas.filter(c=>c.vacant&&Dm.rights(s,m,c.regionId).can);if(vac.length)add(1,'성주가 없는 직할 거점 '+vac.length+'곳: '+vac.map(c=>s.regions[c.regionId].name).join('·')+'. 비워 둬도 기본 행정은 돕니다.',go('성주 임명',`data-act="opk" data-slot="city:${vac[0].regionId}:governor"`));
    const np=s.proposals.filter(p=>p.status==='pending'&&p.to===m).length;if(np)add(1,'답을 기다리는 제안 '+np+'건.',go('보고',`data-act="rv-tab" data-v="report"`))}
  for(const r of s.reports)if(x.weeks.indexOf(r.week-1)>=0&&/완공됐습니다|자리를 떠나|자리를 비우고|보직\(/.test(r.text))add(/완공/.test(r.text)?2:1,r.text,r.regionId?toR(r.regionId):'');
  const dg=x.resourceDelta.gold.close-x.resourceDelta.gold.open,dr=x.resourceDelta.grain.close-x.resourceDelta.grain.open;
  add(2,'국고 '+sgn(dg)+' ('+fmt(x.resourceDelta.gold.open)+' → '+fmt(x.resourceDelta.gold.close)+'), 군량 '+sgn(dr)+'.','');
  for(const c of x.cityDeltas)if(c.notes.length)add(2,s.regions[c.regionId].name+': '+c.notes.join(' · '),toR(c.regionId));
  const quiet=x.cityDeltas.filter(c=>!c.notes.length).length;if(quiet)add(3,'달라진 것이 없는 거점 '+quiet+'곳.','');
  return out.sort((a,b)=>a.p-b.p)}

     <div class="sub" style="margin-top:4px">정비 중에 내린 내정 명령은 예약되고, 재개한 다음 주부터 적용됩니다. 지난달 결산은 바뀌지 않습니다.</div>`;
  const body=`<div class="kpis">${kp('국고',x.resourceDelta.gold.open,x.resourceDelta.gold.close)}${kp('군량',x.resourceDelta.grain.open,x.resourceDelta.grain.close)}${kp('병력',x.resourceDelta.troops.open,x.resourceDelta.troops.close)}${kp('행정 부담',x.admin.open.burden/x.admin.open.capacity,x.admin.close.burden/x.admin.close.capacity,2,true)}${kp('지역 안정도',x.stability.open,x.stability.close,1)}${kp('민심(민생)',x.morale.open,x.morale.close,1)}</div>
   <div class="rv-grid"><div><h3>보고</h3>${pr.filter(p=>p.p<3).map(p=>`<div class="pri p${p.p}"><span class="p">${pn[p.p].slice(0,2)}</span><span>${esc(p.text)}</span><span>${p.act}</span></div>`).join('')}${pr.some(p=>p.p===3)?`<details class="fold2"><summary>일반 보고 ${pr.filter(p=>p.p===3).length}건</summary>${pr.filter(p=>p.p===3).map(p=>`<div class="pri p3"><span class="p">P3</span><span>${esc(p.text)}</span><span></span></div>`).join('')}</details>`:''}${quick}
     <h3>국정 진척</h3>${x.projectDeltas.length?x.projectDeltas.map(projRow).join(''):'<div class="sub">이번 달에 진행한 국정 과제가 없습니다.</div>'}
     <h3>이달의 사건</h3>${x.events.length?x.events.map(e=>`<div class="sub" style="margin:2px 0"><span style="color:var(--text)">${Sim.dateStr(e.week)}</span> ${esc(e.text)}${e.cause?' <span class="tag">'+esc(e.cause)+'</span>':''}</div>`).join(''):'<div class="sub">큰 사건 없이 지나갔습니다.</div>'}</div>
    <div><h3>국고 장부</h3>${ledTable(x.ledger.gold,GOLDCAT)}<h3>군량 장부</h3>${ledTable(x.ledger.grain,GRAINCAT)}<div class="sub" style="margin-top:4px">주마다 실제로 오간 거래의 합입니다 (원장 ${x.ledgerEventIds.length}건). 결산은 이를 확정할 뿐 국고·군량을 따로 주지 않습니다.</div>
     <h3>도시</h3><div style="overflow-x:auto"><table class="city"><tr><th>거점</th><th>안정</th><th>민심</th><th>훈련</th><th>불만</th><th style="text-align:left">까닭</th></tr>${x.cityDeltas.map(c=>cityRow(c,false)).join('')}</table></div>
     ${x.vassalDeltas.length?`<h3>섬기는 호족</h3><div style="overflow-x:auto"><table class="city"><tr><th>거점</th><th>안정</th><th>민심</th><th>훈련</th><th>불만</th><th style="text-align:left">까닭</th></tr>${x.vassalDeltas.map(c=>cityRow(c,true)).join('')}</table></div>`:''}</div></div>`;
  const foot=ro?`<div class="q"><span class="sub">지난 결산은 조회 전용입니다. ${esc(x.settlementId)}</span></div><button class="btn" data-act="rv-close">닫기</button>`
    :`<div class="q"><b>예약 ${Q.length}건</b>${rsv?` · 약정 국고 ${fmt(rsv)} (가용 ${fmt(F.treasury-rsv)})`:''} ${Q.map(q=>`<span class="qc">${esc(q.text)}<button data-act="unqueue" data-id="${q.id}" aria-label="예약 취소">×</button></span>`).join('')}<label class="sub" style="margin-left:6px"><input type="checkbox" id="apm" ${s.dom.gate.autoPauseMonthly?'checked':''}> 달마다 멈춤</label></div><button class="btn" data-act="rv-hide">지도에서 정비하기</button><button class="btn pri" id="rv-resume" data-act="rv-resume">정비 완료 · 진행 재개</button>`;
  const y=(el.querySelector('.rv-b')||{}).scrollTop||0;
  el.hidden=false;
  el.innerHTML=Sim.jo(`<div class="slab orn rv" role="dialog" aria-label="월간 결산"><div class="rv-h">${seal(m,1)}<div><h2>${Dm.monthName(x.monthKey)} 결산</h2><div class="sub">${esc(F.name)} · ${esc(ru.name)} · ${ro?'조회 전용':d.year+'년 '+d.month+'월 '+d.wk+'주 진행 전 · 시간 자동 정지'}${x.fixture?' · <span class="fx">QA fixture</span>':''}</div></div>
    <div class="steps" aria-label="단계"><span class="done">결산 확정</span><span class="${ro?'':'on'}">정비</span><span>재개</span></div>${ro?'<button class="x" data-act="rv-close" aria-label="결산 닫기">×</button>':''}</div><div class="rv-b">${body}</div><div class="rv-f">${foot}</div></div>`);
  const nb=el.querySelector('.rv-b');if(nb)nb.scrollTop=y;drawBanner();
}
function resumeMonthly(){
  const s=G.s,r=Sim.issueOrder(s,me(),'RESUME_FROM_MONTHLY_PAUSE',{});if(!r.ok){toast(r.reason);return}
  G.review=null;G.reviewHidden=false;G.paused=!G.wasRunning;G.acc=0;
  toast('정비를 마쳤습니다.'+(r.committed?' 예약한 명령 '+r.committed+'건을 실행했습니다.':'')+(r.failed.length?' '+r.failed.length+'건은 조건이 바뀌어 실행하지 못했습니다(보고 참고).':'')+(G.paused?' 시간은 멈춰 있습니다.':''));
  store.set(AUTO,{s});drawAll();
}

function start(s){$('#app').classList.remove('idle');G.s=s;G.sel={type:'region',id:s.factions[s.playerFactionId].capitalId};G.sheet=null;G.tab='report';G.ltab='info';G.rightOpen=true;G.picker=null;G.acc=0;G.paused=true;G.wasRunning=false;G.seen=s.reports.length;G.veil=null;$('#veil').style.display='none';$('#modal').hidden=true;
  G.review=monthlyPaused()?{mk:Dm.settlementKeys(s,s.playerFactionId).slice(-1)[0],readonly:false}:null;G.reviewHidden=false;fit();drawAll();if(s.over)showEnd()}
function doTick(){
  const s=G.s;if(!s||s.over)return;if(monthlyPaused()){G.paused=true;drawTop();return}
  const wasRun=!G.paused;Sim.tick(s);
  const urg=s.reports.filter(r=>r.week===s.week&&r.urgent);G.seen=s.reports.length;
  if(G.sheet&&G.sheet.type==='move'&&!s.armies[G.sheet.armyId])G.sheet=null;
  if(G.sel&&G.sel.type==='army'&&!s.armies[G.sel.id])G.sel=null;
  store.set(AUTO,{s});
  const fin=(s.pendingResults||[]).map(id=>Sim.engById(s,id)).filter(e=>e&&e.attackers.concat(e.defenders).indexOf(me())>=0);
  if(monthlyPaused()){G.wasRunning=wasRun;s.dom.gate.originSpeed=G.speed;G.paused=true;G.acc=0;G.review={mk:Dm.settlementKeys(s,me()).slice(-1)[0],readonly:false};G.reviewHidden=false;if(fin.length&&(!G.sheet||G.sheet.type==='result'))G.sheet={type:'result',id:fin[fin.length-1].id}}
  else if(fin.length&&(!G.sheet||G.sheet.type==='result')){G.sheet={type:'result',id:fin[fin.length-1].id};if(G.autoPause)G.paused=true}
  else if(urg.length&&G.autoPause&&!G.paused){G.paused=true;G.tab='report';G.rightOpen=true;toast('시간을 멈췄습니다: '+urg[urg.length-1].text)}
  if(!monthlyPaused()&&!G.sheet&&s.proposals.some(p=>p.to===me()&&p.status==='pending'&&p.week===s.week)){G.tab='report';G.rightOpen=true;if(G.autoPause)G.paused=true}
  drawAll();if(s.over)showEnd();
}
function escKey(){
  const pk=G.picker;
  if(pk){if(pk.stage==='CONFIRM'){pk.stage='COMPARE';drawPicker()}else if(pk.sel){pk.sel=null;pk.msg='';drawPicker()}else closePicker();return true}
  if(G.review&&!G.reviewHidden){if(G.review.readonly||!monthlyPaused())G.review=null;else G.reviewHidden=true;drawAll();return true}
  if(G.sheet){G.sheet=null;drawAll();return true}
  return false}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.getAttribute('aria-disabled')==='true')return;
  const a=t.dataset.act,v=t.dataset.v,s=G.s,m=s&&me(),pk=G.picker;
  if(a==='desel'){G.sel=null;drawAll()}

  else if(a==='rclose'){G.rightOpen=false;drawAll()}

    if(sl.kind==='city')dcmd('ASSIGN_CITY_OFFICER',{regionId:sl.regionId,slot:sl.role==='governor'?'governor':'deputy:'+sl.idx,charId:null},nm+'을(를) 자리에서 물렸습니다.');
    else if(sl.kind==='national')dcmd('ASSIGN_NATIONAL_OFFICER',{category:sl.cat,charId:null},nm+'을(를) 자리에서 물렸습니다.');
    else dcmd('ASSIGN_ARMY_OFFICER',{armyId:sl.armyId,slot:sl.role==='commander'?'commander':'deputy:'+sl.idx,charId:null},nm+'을(를) 지휘부에서 뺐습니다.')}
  else if(a==='focus'){const R=s.regions[G.sel.id],cur=s.dom.cityDomesticByRegion[R.id].focusDomain;dcmd('SET_CITY_FOCUS',{regionId:R.id,domain:cur===v?null:v},cur===v?R.name+'의 중점 분야를 풀었습니다.':R.name+'의 중점을 '+Dm.DOMAIN[v].name+'(으)로 정했습니다.')}
  else if(a==='build'){const R=s.regions[G.sel.id];dcmd('START_FACILITY_BUILD',{regionId:R.id,facility:v},R.name+' '+Dm.FACILITY[v].name+' 공사를 시작했습니다. '+BAL.cityFacilities.constructionWeeks+'주 뒤 완공됩니다.')}
  else if(a==='gov'){G.sheet={type:'govern',regionId:G.sel.id,to:t.dataset.to,force:t.dataset.force==='1'};drawAll()}
  else if(a==='go-gov'){const sh=G.sheet,R=s.regions[sh.regionId],pv=Dm.governancePreview(s,m,R.id,sh.to,sh.force),r=dcmd('REQUEST_GOVERNANCE_CHANGE',{regionId:R.id,to:sh.to,force:sh.force},pv.kind==='consent'?'사신이 떠났습니다. '+K.envoyWeeks+'주 뒤 답이 옵니다.':pv.kind==='reassure'?R.name+'의 자치를 다시 보장했습니다.':R.name+'의 통치 방식을 바꾸기 시작했습니다. '+pv.weeks+'주 걸립니다.');if(r.ok){G.sheet=null;drawAll()}}
  else if(a==='budget')dcmd('CHANGE_NATIONAL_BUDGET',{category:t.dataset.cat,budgetTier:v},Dm.CATNAME[t.dataset.cat]+' 예산을 '+Dm.TIERNAME[v]+'(으)로 바꿨습니다. 다음 주 지급분부터 적용됩니다.');
  else if(a==='proj'){const d=Dm.PROJECTS[v],sel=$('#prj-target');dcmd('START_NATIONAL_PROJECT',{category:t.dataset.cat,projectId:v,targetRegionId:d.target?(sel?sel.value:G.prjT):undefined},d.name+'에 착수했습니다. 달마다 결산에서 진척됩니다.')}
  else if(a==='enact')dcmd('ENACT_POLICY',{policyId:v},Dm.PROJECTS[v].name+'을(를) 시행했습니다. 행정 역량이 올랐습니다.');
  else if(a==='unqueue'){const r=Dm.cancelPending(s,t.dataset.id);toast(r.ok?'예약을 취소했습니다.':r.reason);drawAll()}
  else if(a==='review')openReview(v,!(monthlyPaused()&&s.dom.gate.activeSettlementId===Dm.sidOf(s,m,v)));
  else if(a==='rv-close'){G.review=null;drawAll()}

  else if(a==='rv-show'){G.review={mk:Dm.settlementKeys(s,m).slice(-1)[0],readonly:false};G.reviewHidden=false;drawAll()}
  else if(a==='rv-tab'){if(G.review&&!G.review.readonly)G.reviewHidden=true;else G.review=null;G.tab=v;G.sheet=null;G.rightOpen=true;drawAll()}
  else if(a==='rv-goto'){e.preventDefault();if(G.review&&!G.review.readonly&&monthlyPaused())G.reviewHidden=true;else G.review=null;G.sel={type:'region',id:t.dataset.id};G.ltab=v||'city';G.sheet=null;const p=RP[t.dataset.id],vb=G.vb;vb.x=p[0]-vb.w/2;vb.y=p[1]-vb.h/2;applyVB();drawAll()}

  else if(a==='opk-close')closePicker();
  else if(a==='opk-row'){pk.sel=pk.sel===t.dataset.id?null:t.dataset.id;pk.stage='COMPARE';pk.ack=false;pk.msg='';drawPicker()}
  else if(a==='opk-sort'){if(pk.sort===v)pk.desc=!pk.desc;else{pk.sort=v;pk.desc=v!=='name'&&v!=='post'&&v!=='status'}drawPicker();const b=document.querySelector(`#modal [data-act="opk-sort"][data-v="${v}"]`);if(b)b.focus()}
  else if(a==='opk-filter'){pk.filter=v;drawPicker()}
  else if(a==='opk-domain'){pk.domain=v;pk.stage='COMPARE';drawPicker()}
  else if(a==='opk-next'){pk.stage='CONFIRM';pk.ack=false;drawPicker();const g=$('#opk-ack')||$('#opk-go');if(g)g.focus()}
  else if(a==='opk-back'){pk.stage='COMPARE';drawPicker()}
  else if(a==='opk-dismiss'){const c=pickerCmd(null),nm=s.characters[Dm.holderOf(s,pk.slotId)].name,r=Dm.command(s,m,c[0],c[1]);if(r.ok){closePicker();toast(r.queued?nm+' 해임을 예약했습니다.':nm+'을(를) 자리에서 물렸습니다.')}else{pk.msg=r.reason;drawPicker()}}
  else if(a==='opk-go'){const c=pickerCmd(pk.sel),ch=s.characters[pk.sel],stale=s.dom.revision!==pk.origin.worldRevision,r=Dm.command(s,m,c[0],c[1]); // 확정 직전에 엔진이 권한·주직·소속을 다시 검증한다
    if(r.ok){const lbl=Dm.slotLabel(s,pk.slotId);closePicker();toast(r.queued?ch.name+' 임명을 예약했습니다. 재개한 다음 주부터 적용됩니다.':ch.name+'을(를) '+lbl+'에 임명했습니다.'+(r.weeks?' '+r.weeks+'주 뒤 도착합니다.':'')+(r.vacated?' '+r.vacated+' 자리는 비었습니다.':''))}
    else{pk.stage='COMPARE';pk.msg=(stale?'그 사이 상황이 바뀌어 다시 확인했습니다. ':'')+r.reason;drawPicker()}}
});
document.addEventListener('input',e=>{const t=e.target,pk=G.picker;
  if(t.id==='apm'&&G.s){Dm.setAutoPause(G.s,t.checked);toast(t.checked?'달이 바뀌면 결산하고 멈춥니다.':'결산 기록은 남기되 멈추지 않습니다.');return}
  if(t.id==='prj-target'){G.prjT=t.value;drawRight();return}
  if(!pk)return;
  if(t.id==='opk-q'){pk.q=t.value;const p=t.selectionStart;drawPicker();const n=$('#opk-q');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(_){}}}
  else if(t.id==='opk-ack'){pk.ack=t.checked;drawPicker();const n=$('#opk-ack');if(n)n.focus()}
});
// 겹창이 떠 있는 동안: Esc는 확인 단계 → 선택 → 닫기 순, Tab은 창 안에서만 돈다
document.addEventListener('keydown',e=>{
  const box=G.picker?$('#modal'):G.review&&!G.reviewHidden?$('#review'):null;if(!box)return;
  if(e.key==='Escape'){e.preventDefault();e.stopPropagation();escKey();return}
  if(e.key==='Tab'){const f=[...box.querySelectorAll('button,input,select,a[href],[tabindex="0"]')].filter(x=>x.getAttribute('aria-disabled')!=='true'&&!x.disabled&&x.offsetParent!==null);if(!f.length)return;const i=f.indexOf(document.activeElement);
    if(e.shiftKey&&(i<=0)){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&(i===f.length-1||i<0)){e.preventDefault();f[0].focus()}}
  else if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-act="opk-row"]')){e.preventDefault();e.target.click()}
  if(e.code==='Space'&&!/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)){e.preventDefault();e.stopPropagation()}
},true);

// ── 부팅 ──
buildMap();fit();
function boot(data){const ms=data&&data.s&&Sim.migrate(data.s);if(ms){start(ms)}else{G.s=Sim.newGame('goryeo',929);drawRegions();drawArmies();G.s=null;showStart()}requestAnimationFrame(frame)}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({s:G.s}));
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
window.__G=G;
})();

</script>
